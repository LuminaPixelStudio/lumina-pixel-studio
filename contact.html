<link rel="canonical" href="https://luminapixelstudio.com/contact.html">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">

<meta property="og:description" content="Get in touch to start your website project. I reply within 1–2 business days.">

<meta property="og:image" content="https://luminapixelstudio.com/earth-bg.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="site-bg" aria-hidden="true"></div>

<header class="tabbar">
  <div class="tabbar-inner">
    <div class="logo">
      <a href="index.html"><img src="logo-header.png" alt="Lumina Pixel Studio" class="logo-img"></a>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-right" id="navRight">
      <nav class="tabs" id="navTabs">
        <a href="index.html" data-tab="home">Home</a>
        <a href="portfolio.html" data-tab="portfolio">Portfolio</a>
        <a href="pricing.html" data-tab="pricing">Pricing</a>
      </nav>
      <a href="contact.html" class="tabbar-cta">Start a project</a>
    </div>
  </div>
</header>

<main>
  <section>
    <div class="wrap">
      <div class="contact-center">
        <div class="form-box reveal">
          <div class="browser-body">
            <form id="contactForm" method="POST">
              <input type="hidden" name="access_key" value="9fc01e5d-b1a6-42a4-96c6-99cfb1579ef9">
              <input type="hidden" name="subject" value="New project inquiry — Lumina Pixel Studio">
              <input type="checkbox" name="botcheck" style="display:none;" tabindex="-1" autocomplete="off">
              <div class="field-group">
                <div class="field">
                  <label for="name">Name</label>
                  <input id="name" name="name" type="text" placeholder="Your name" required>
                </div>
                <div class="field">
                  <label for="business">Business name <span class="optional">(optional)</span></label>
                  <input id="business" name="business" type="text" placeholder="Your business name">
                </div>
                <div class="field">
                  <label for="email">Email address</label>
                  <input id="email" name="email" type="email" placeholder="you@company.com" required>
                </div>
                <div class="field">
                  <label for="phone">Phone number <span class="optional">(optional)</span></label>
                  <input id="phone" name="phone" type="tel" placeholder="Your phone number">
                </div>
                <div class="field">
                  <label for="need">What do you need?</label>
                  <select id="need" name="need" required>
                    <option value="" disabled selected>Select an option</option>
                    <option value="New website">New website</option>
                    <option value="Website redesign">Website redesign</option>
                    <option value="Website maintenance">Website maintenance</option>
                    <option value="SEO">SEO</option>
                    <option value="Something else">Something else</option>
                  </select>
                </div>
                <div class="field">
                  <label for="message">Project details</label>
                  <textarea id="message" name="message" rows="6" placeholder="Tell me about your business and what you're looking for." required></textarea>
                </div>
              </div>
              <button type="submit" class="submit-btn">Send message</button>
              <p class="form-reassurance">I'll get back to you within one business day.</p>
              <p class="form-status" id="formStatus" role="status"></p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>


<script src="script.js"></script>
</body>
</html>
